<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ride</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Schedule a Test Ride</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="comparison.html">Compare Bikes</a></li>
                <li><a href="booking.html">Book a Bike</a></li>
                <li><a href="emi-calculator.html">EMI Calculator</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Book Your Test Ride</h2>
        <form action="#" method="post">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="bike">Choose a Bike for Test Ride:</label>
            <select id="bike" name="bike">
                <option value="bike1">Bike 1</option>
                <option value="bike2">Bike 2</option>
            </select>

            <label for="date">Preferred Test Ride Date:</label>
            <input type="date" id="date" name="date" required>

            <button type="submit">Book Test Ride</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 Bike Comparison & Booking. All rights reserved.</p>
    </footer>
</body>
</html>
