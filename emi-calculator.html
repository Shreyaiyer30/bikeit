<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>EMI Calculator</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="comparison.html">Compare Bikes</a></li>
                <li><a href="booking.html">Book a Bike</a></li>
                <li><a href="test-ride.html">Test Ride</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Calculate Your EMI</h2>
        <form id="emi-form">
            <label for="price">Bike Price ($):</label>
            <input type="number" id="price" name="price" required>

            <label for="downpayment">Down Payment ($):</label>
            <input type="number" id="downpayment" name="downpayment" required>

            <label for="rate">Interest Rate (%):</label>
            <input type="number" id="rate" name="rate" required>

            <label for="months">Loan Tenure (Months):</label>
            <input type="number" id="months" name="months" required>

            <button type="button" onclick="calculateEMI()">Calculate EMI</button>
        </form>

        <h3 id="emi-result"></h3>
    </section>

    <footer>
        <p>&copy; 2024 Bike Comparison & Booking. All rights reserved.</p>
    </footer>

    <script src="emiCalculator.js"></script>
</body>
</html>
